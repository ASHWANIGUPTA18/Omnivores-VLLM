# Omnivores - GPU stack.
#
# The full production shape: vLLM serving a local model, the backend using it,
# local embeddings and a Chroma index.
#
#   cp .env.example .env        # then edit MODEL_NAME / TOOL_CALL_PARSER
#   docker compose -f docker-compose.gpu.yml up -d --build
#
# Requires an NVIDIA GPU and the NVIDIA Container Toolkit.
#
# CODE EXECUTION (@coder's run_python tool)
# Disabled by default. The backend image ships no docker CLI and runs as uid
# 10001, so PYTHON_SANDBOX_MODE=docker cannot work without also patching
# backend/Dockerfile and adding group_add for the host's docker group. To
# enable it, see docs/RUNBOOK-GPU.md. Every other feature works without it.
#
# SECURITY NOTE
# Enabling the sandbox requires mounting the Docker socket (commented out
# below). That is a privileged mount: anything able to execute inside the
# backend container can control the host's Docker daemon. Accept it only on a
# machine you control, and keep the backend port off the public internet.

services:
  vllm:
    build:
      context: ./inference
      args:
        VLLM_VERSION: ${VLLM_VERSION:-latest}
    image: omnivores-vllm:latest
    container_name: omnivores-vllm
    restart: unless-stopped

    # Not published to the host: only the backend needs to reach it, and vLLM
    # should never be directly exposed.
    expose:
      - "8001"

    environment:
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME, see inference/config/models.yaml}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-}
      TENSOR_PARALLEL_SIZE: ${TENSOR_PARALLEL_SIZE:-auto}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-32768}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.90}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-64}
      DTYPE: ${DTYPE:-auto}
      QUANTIZATION: ${QUANTIZATION:-}
      ENABLE_TOOL_CALLING: "true"
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:?set TOOL_CALL_PARSER to match your model}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}

    volumes:
      - huggingface-cache:/root/.cache/huggingface

    shm_size: "16gb"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Weight downloads on a first run take a long time.
      start_period: 900s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_CHROMA: "true"
        INSTALL_LOCAL_EMBEDDINGS: "true"
    image: omnivores-backend:gpu
    container_name: omnivores-backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json

      LLM_PROVIDER: vllm
      VLLM_BASE_URL: http://vllm:8001/v1
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      MODEL_NAME: ${SERVED_MODEL_NAME:-${MODEL_NAME}}

      # The runtime takes min(MAX_CONTEXT_TOKENS, what the server reports), so
      # leaving this at its 16384 default wastes half of a 32768 window.
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-28672}
      CONTEXT_RAG_TOKEN_BUDGET: ${CONTEXT_RAG_TOKEN_BUDGET:-6000}

      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      VECTOR_STORE: chroma
      RERANKER: ${RERANKER:-lexical}

      # See the note at the top of this file before setting this to "docker".
      PYTHON_SANDBOX_MODE: ${PYTHON_SANDBOX_MODE:-disabled}
      PYTHON_SANDBOX_IMAGE: omnivores-sandbox:latest

      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-mock}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # Leave API_KEY empty for a local demo. The frontend image bakes
      # VITE_API_KEY in at build time and this compose file passes none, so a
      # non-empty API_KEY here makes the UI 401 on every request.
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      # Needed only if EMBEDDING_MODEL or RERANKER_MODEL is a gated repo.
      HF_TOKEN: ${HF_TOKEN:-}

      UPLOAD_DIR: /app/data/uploads
      VECTOR_STORE_PATH: /app/data/vectorstore

    volumes:
      - backend-data:/app/data
      - model-cache:/home/omnivores/.cache
      # Custom agent YAML. The image copies only app/, so without this mount
      # anything in backend/agents.d is silently ignored.
      - ./backend/agents.d:/app/agents.d:ro
      # Uncomment for PYTHON_SANDBOX_MODE=docker. See the note at the top.
      # - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      vllm:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: omnivores-frontend:latest
    container_name: omnivores-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  huggingface-cache:
  model-cache:
