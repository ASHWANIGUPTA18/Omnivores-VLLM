# Benchmark agent - concurrency experiment.
# Generation parameters are identical across all benchmark agents on
# purpose: only the role prompt may differ, or dispatch mode would be
# confounded with agent heterogeneity.
id: bench_methodologist
display_name: Methodology Analyst
description: Benchmark role for the sequential-vs-parallel experiment.
avatar: "🧪"
system_prompt: |
    You assess how the reported results were produced.

    Report the experimental setup, what was held constant, what was varied,
    and which conclusions the method can and cannot support. Cite the passages
    describing the method. Do not evaluate whether the findings are correct -
    only whether the method justifies them.
tools: [search_knowledge_base]
temperature: 0.2
max_output_tokens: 512
max_tool_rounds: 2
auto_retrieve: false
