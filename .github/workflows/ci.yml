name: CI

# The whole suite runs against the mock providers, so CI needs no GPU, no
# model download and no API keys. That is the point of the abstraction: if this
# workflow ever needs a secret to pass, something has leaked into the core.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Types
        # Not gating yet: annotated but not strict-clean.
        run: mypy app || true

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

      - name: Verify the app starts and answers
        run: |
          python -m uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          python ../scripts/health-check.py --full
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          VECTOR_STORE: memory

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the development stack
        run: docker compose build

      - name: Boot it and check health
        run: |
          docker compose up -d
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          python scripts/health-check.py --full

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
