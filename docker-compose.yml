# Omnivores - development stack.
#
# Backend and frontend only. No GPU required, no model download, no API keys:
# the backend runs on the mock inference provider and hashed embeddings, so
# every part of the application except the model itself is exercised for real.
#
#   docker compose up
#   open http://localhost:3000
#
# For the GPU deployment with vLLM, use docker-compose.gpu.yml.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: omnivores-backend:latest
    container_name: omnivores-backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Everything offline by default.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      VECTOR_STORE: ${VECTOR_STORE:-memory}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-mock}
      # Code execution needs the Docker socket, which this stack deliberately
      # does not mount. See docker-compose.gpu.yml.
      PYTHON_SANDBOX_MODE: disabled

      UPLOAD_DIR: /app/data/uploads
      VECTOR_STORE_PATH: /app/data/vectorstore
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173

    volumes:
      - backend-data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: omnivores-frontend:latest
    container_name: omnivores-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
